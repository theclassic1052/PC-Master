name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android-src.tgz', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack
        run: tar xzf android-src.tgz
      - name: Build
        working-directory: android
        env:
          VCODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pcmaster.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "PC마스터 안드로이드 앱" --notes "최신 PC마스터 앱 (pcmaster.apk)"
          gh release upload apk pcmaster.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pcmaster-apk
          path: pcmaster.apk

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PC마스터 · 선우컴퓨터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>:root {
  --bg: #050914;
  --bg2: #0a1224;
  --card: #0f1a30;
  --card2: #13213d;
  --line: #1f2f50;
  --line2: #2a3e66;
  --text: #e6edf8;
  --sub: #93a3bf;
  --mute: #5f7090;
  --pri: #3b82f6;
  --pri2: #2563eb;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --pink: #f472b6;
  --inc: #38bdf8;
  --exp: #fb7185;
  --radius: 14px;
  --nav-h: 64px;
  --head-h: 52px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
  font-size: 16.9px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

#root { max-width: 640px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ---------- Header ---------- */
.hdr {
  position: sticky; top: 0; z-index: 30; height: var(--head-h);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: rgba(5, 9, 20, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; font-size: 19.4px; flex: none; }
.brand { font-weight: 800; font-size: 19.4px; letter-spacing: -.3px; white-space: nowrap; }
.brand small { display: block; font-size: 12.1px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-top: -2px; }
.hdr-tab { font-size: 13.3px; padding: 2px 7px; border-radius: 6px; background: #13274d; color: #93c5fd; font-weight: 700; white-space: nowrap; }
.hdr-actions { margin-left: auto; display: flex; gap: 6px; }
.ibtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--sub); position: relative; font-size: 19.4px; }
.ibtn:active { transform: scale(.95); }
.ibtn .dot { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 12.1px; font-weight: 800; display: grid; place-items: center; }
.ibtn.sync-on { color: var(--ok); }
.ibtn.sync-err { color: var(--bad); }

/* ---------- Page ---------- */
.page { padding: 12px 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.page-head { display: flex; align-items: center; gap: 8px; }
.page-title { display: flex; align-items: center; gap: 8px; font-size: 21.8px; font-weight: 800; letter-spacing: -.4px; }
.page-title .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--card2); display: grid; place-items: center; color: #93c5fd; font-size: 19.4px; }

.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 5px 10px; border-radius: 7px; color: var(--sub); font-weight: 700; font-size: 15.7px; white-space: nowrap; }
.seg button.on { background: var(--pri); color: #fff; }
.page-head .seg { margin-left: auto; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.card.pad0 { padding: 0; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 800; }
.card-h .cnt { font-size: 13.3px; background: var(--card2); color: var(--sub); padding: 1px 7px; border-radius: 10px; font-weight: 700; }
.card-h .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.stats { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.stat { padding: 10px 6px; text-align: center; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .k { font-size: 13.3px; color: var(--sub); font-weight: 600; }
.stat .v { font-size: 19.4px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.kpi .k { color: var(--sub); font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.kpi .v { font-size: 24.2px; font-weight: 800; margin-top: 6px; letter-spacing: -.5px; }
.kpi .s { font-size: 13.3px; color: var(--mute); margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: 15.7px; background: var(--card2); border: 1px solid var(--line2); color: var(--text); white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.ok { background: #059669; border-color: #059669; color: #fff; }
.btn.bad { background: transparent; border-color: #7f1d1d; color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 14.5px; border-radius: 8px; }
.btn.lg { height: 46px; font-size: 18.2px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13.3px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--card2); color: var(--sub); white-space: nowrap; }
.biz { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: 13.3px; font-weight: 800; color: #fff; flex: none; }
.biz.none { background: #334155; color: #cbd5e1; }

/* ---------- Tabs (status) ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; padding: 7px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--sub); font-weight: 700; font-size: 15.7px; }
.tabs button.on { background: #13274d; border-color: var(--pri); color: #fff; }
.tabs button small { font-size: 13.3px; opacity: .8; margin-left: 2px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 14.5px; color: var(--sub); font-weight: 700; }
.inp, select.inp, textarea.inp { width: 100%; height: 40px; padding: 0 11px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line2); outline: none; font-size: 16.9px; }
textarea.inp { height: auto; min-height: 80px; padding: 9px 11px; resize: vertical; }
.inp:focus { border-color: var(--pri); }
.inp.sm { height: 32px; font-size: 15.7px; padding: 0 8px; }
.inp.r { text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.search { position: relative; flex: 1; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--mute); }
.search .inp { padding-left: 32px; height: 36px; }

/* ---------- List items ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; }
.item.sel { border-color: var(--pri); background: #0f2142; }
.item .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.item .l1 .name { font-weight: 800; font-size: 18.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .l1 .right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.item .l2 { color: var(--sub); font-size: 15.7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .l3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14.5px; color: var(--mute); }
.item .acts { display: flex; gap: 6px; margin-left: auto; }
.amt { font-weight: 800; white-space: nowrap; }
.amt.inc { color: var(--inc); }
.amt.exp { color: var(--exp); }
.muted { color: var(--mute); }
.sub { color: var(--sub); }
.empty { text-align: center; color: var(--mute); padding: 28px 10px; font-size: 15.7px; }
.status-sel { height: 26px; font-size: 14.5px; font-weight: 800; border-radius: 7px; padding: 0 4px; border: 1px solid var(--line2); background: var(--bg2); }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: 28px repeat(7, 1fr) 28px; gap: 4px; align-items: stretch; }
.week .nav { display: grid; place-items: center; color: var(--sub); border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 0 4px; text-align: center; position: relative; min-width: 0; }
.day .w { font-size: 13.3px; color: var(--sub); font-weight: 700; }
.day .d { font-size: 19.4px; font-weight: 800; line-height: 1.2; }
.day .lu { font-size: 10.9px; color: var(--mute); white-space: nowrap; overflow: hidden; }
.day .lu.cho { color: var(--warn); font-weight: 800; }
.day.sun .w, .day.sun .d { color: #fb7185; }
.day.sat .w, .day.sat .d { color: #60a5fa; }
.day.today { border-color: var(--line2); background: var(--card2); }
.day.on { background: var(--pri); border-color: var(--pri); }
.day.on .w, .day.on .d, .day.on .lu { color: #fff !important; }
.day .badge { position: absolute; top: -5px; right: -3px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--pink); color: #fff; font-size: 10.9px; font-weight: 800; display: grid; place-items: center; padding: 0 3px; }

/* ---------- Bottom nav ---------- */
.bnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; z-index: 40;
  display: grid; grid-template-columns: repeat(7, 1fr); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: rgba(8, 13, 28, .96); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.bnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--mute); font-size: 13.3px; font-weight: 700; position: relative; }
.bnav button svg { font-size: 24.2px; }
.bnav button.on { color: #fff; }
.bnav button.on::before { content: ''; position: absolute; inset: 6px 6px; border-radius: 12px; background: #13274d; z-index: -1; }
.bnav .dot { position: absolute; top: 6px; left: calc(50% + 4px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 12.1px; display: grid; place-items: center; padding: 0 4px; }

/* ---------- Sheet (bottom modal) ---------- */
.backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { width: 100%; max-width: 640px; max-height: 92vh; background: var(--bg2); border: 1px solid var(--line2); border-bottom: 0; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; font-weight: 800; font-size: 19.4px; border-bottom: 1px solid var(--line); }
.sheet-h .x { margin-left: auto; }
.sheet-b > * { flex-shrink: 0; }
.sheet-b { padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.sheet-f { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }

.toast { position: fixed; left: 50%; top: calc(var(--head-h) + 10px); transform: translateX(-50%); z-index: 90; background: #111c33; border: 1px solid var(--line2); padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.5); max-width: 90vw; animation: up .2s; }

/* ---------- Line items editor ---------- */
.li { display: grid; grid-template-columns: 78px 1fr 30px; gap: 6px; align-items: center; }
.li2 { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 6px; margin: -2px 0 6px 84px; }
.li-wrap { border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.totals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.totals div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.totals div.t { background: #13274d; border-color: var(--pri); }
.totals .k { font-size: 13.3px; color: var(--sub); }
.totals .v { font-weight: 800; }

/* ---------- Misc ---------- */
.alert { display: flex; align-items: center; gap: 10px; background: #2a1f06; border: 1px solid #6b4e0c; border-radius: var(--radius); padding: 10px 12px; color: #fde68a; }
.alert .grow b { display: block; }
.alert small { color: #d6b25e; }
.banner { display: flex; align-items: center; gap: 8px; background: #0b1a33; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14.5px; color: var(--sub); }
.bar { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pri); border-radius: 3px; }
.kv { display: flex; justify-content: space-between; font-size: 15.7px; padding: 3px 0; }
.kv .k { color: var(--sub); }
.divider { height: 1px; background: var(--line); margin: 4px 0; }
.check { width: 18px; height: 18px; accent-color: var(--pri); flex: none; }
.hint { font-size: 14.5px; color: var(--mute); }
code.blk { display: block; white-space: pre-wrap; word-break: break-all; font-size: 13.3px; background: #030712; border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: #a5b4fc; }
.raw { font-size: 13.3px; color: var(--mute); background: #070d1b; border-radius: 6px; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-btns { display: flex; gap: 6px; }
.pill-btns .btn { flex: 1; }
.callbar { display: flex; align-items: center; gap: 8px; }

@media (min-width: 520px) {
  .kpis.four { grid-template-columns: repeat(4, 1fr); }
}

.backdrop.center { align-items: center; padding: 16px; }
.dialog { width: 100%; max-width: 360px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 16px; padding: 18px; animation: up .15s; }

/* ---------- 폴드 펼친 화면 · 태블릿 · PC (넓은 화면) ---------- */
@media (min-width: 700px) {
  #root { max-width: 1200px; }
  .hdr { padding: 0 20px; }
  .page { padding-left: 20px; padding-right: 20px; gap: 14px; }
  .page > .list, .page > .list.grouped { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
  .page > .list > .empty, .page > .list > .row { grid-column: 1 / -1; }
  .kpis, .kpis.four { grid-template-columns: repeat(4, 1fr); }
  .bnav { max-width: 1200px; }
  .bnav button { flex-direction: row; gap: 6px; font-size: 15.7px; }
  .bnav .dot { left: auto; right: 12%; }
  .backdrop { align-items: center; padding: 20px; }
  .sheet { max-width: 620px; max-height: 88vh; border-radius: 18px; border-bottom: 1px solid var(--line2); }
  .sheet-f { padding-bottom: 12px; }
  .week .day .lu { font-size: 12.1px; }
  .stat .v { font-size: 21.8px; }
  .li-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 6px; align-items: center; }
  .li2 { margin: 0; grid-template-columns: 56px 1fr 96px; }
}
.dash-grid { display: flex; flex-direction: column; gap: 12px; }
/* 대시보드: 넓은 화면에서 2단 */
@media (min-width: 900px) {
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .dash-grid > .span2 { grid-column: 1 / -1; }
}

/* ---------- 통화 인입 목록 · 팝업 ---------- */
.call-row { display: grid; grid-template-columns: 1fr 76px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.call-info { text-align: left; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.call-info .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.call-info .name { font-weight: 800; font-size: 18.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.call-info .l2 { color: var(--sub); font-size: 15.7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call-info .l3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14.5px; color: var(--mute); }
.call-accept { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #065f46; color: #fff; font-weight: 800; font-size: 15.7px; border-left: 1px solid #047857; }
.call-accept:active { background: #047857; }
.dialog.intake { max-width: 480px; max-height: 90vh; overflow-y: auto; border-color: #1d4ed8; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(59,130,246,.3); }
.intake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.intake-grid .seg { width: 100%; }
.intake-grid .seg button { flex: 1; }

/* ---------- 눌러서 바로 수정 ---------- */
.ie { cursor: text; border-bottom: 1px dashed transparent; border-radius: 2px; }
.ie:hover, .ie:active { border-bottom-color: var(--line2); background: rgba(59,130,246,.08); }
.ie-empty { color: var(--mute); font-style: italic; }
.ie-input { width: 100%; min-width: 0; background: var(--bg2); border: 1px solid var(--pri); border-radius: 6px; padding: 3px 7px; font: inherit; color: var(--text); outline: none; }
textarea.ie-input { resize: vertical; white-space: pre-wrap; }
.chip-in { appearance: none; -webkit-appearance: none; background: var(--card2); border: 1px solid transparent; color: var(--sub); border-radius: 6px; padding: 1px 5px; font: inherit; font-size: 13.3px; font-weight: 700; color-scheme: dark; min-width: 0; }
.chip-in:focus { border-color: var(--pri); outline: none; color: var(--text); }
.chip-in::-webkit-calendar-picker-indicator { filter: invert(.7); padding: 0; margin: 0 0 0 2px; width: 12px; }
.item .l2.editable { white-space: normal; display: flex; flex-direction: column; gap: 2px; }
.item .l2.editable .ie { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-in.time-txt { font-size: 14.5px; font-weight: 800; color: var(--text); }
.chip.pay-amt { padding-right: 4px; }
/* 일정 카드 3번째 줄: 주소가 최대한 보이도록 간격 최소화 */
.item .l3.tight { gap: 3px; }
.item .l3.tight .chip { padding: 2px 4px; gap: 2px; }
.item .l3.tight .chip-in { padding: 1px 2px; }
.item .l3.tight .chip svg { width: 12px; height: 12px; flex: none; }
.item .l3.tight .chip .map-link { color: #fff; display: inline-flex; }
.item .l3.tight .chip .map-link svg { width: 14.5px; height: 14.5px; }

/* ---------- 장부 목록: 입금/출금 테두리 색, 촘촘한 줄간격, 흰 글씨 ---------- */
.list.tx-list { gap: 6px; }
.item.tx-item { gap: 3px; padding: 8px 10px; border: 2px solid; line-height: 1.3; }
.item.tx-item.inc { border-color: #38bdf8; }
.item.tx-item.exp { border-color: #fb7185; }
.item.tx-item.sel { border-color: var(--pri); }
.item.tx-item .l3, .item.tx-item .l3 span, .item.tx-item .l3 .sub, .item.tx-item .raw { color: #fff !important; }
.item.tx-item .raw { background: rgba(255,255,255,.06); }
.item.tx-item .row { gap: 6px; }
.send-prev { background: #fff; border-radius: 8px; overflow: hidden; max-height: 55vh; overflow-y: auto; }
.send-prev img { display: block; width: 100%; height: auto; }
.send-prev .empty { color: #555; }
a.btn { text-decoration: none; }
</style>
</head>
